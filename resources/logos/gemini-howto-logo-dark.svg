<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="120" viewBox="0 0 560 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Gemini & Antigravity How-To Logo — Dark background version -->
  <defs>
    <linearGradient id="geminiGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="560" height="120" fill="#0B0F19" rx="8"/>

  <!-- === MARK (Orbital Ring + Gemini Spark) === -->
  <g transform="translate(0, 0)">
    <!-- Outer orbital ring -->
    <circle cx="60" cy="60" r="50" fill="none" stroke="#F8FAFC" stroke-width="2.5" stroke-dasharray="220 20"/>
    <!-- Inner antigravity orbit -->
    <ellipse cx="60" cy="60" rx="46" ry="20" transform="rotate(-28 60 60)" fill="none" stroke="url(#geminiGradDark)" stroke-width="2.5"/>

    <!-- Cardinal tick marks -->
    <line x1="60" y1="8" x2="60" y2="16" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="104" x2="60" y2="112" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="60" x2="16" y2="60" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="104" y1="60" x2="112" y2="60" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

    <!-- Gemini Four-Point Star Spark -->
    <path d="M60,24 C62,46 74,58 96,60 C74,62 62,74 60,96 C58,74 46,62 24,60 C46,58 58,46 60,24 Z" fill="url(#geminiGradDark)"/>

    <!-- Center terminal prompt > -->
    <g transform="translate(60, 60)">
      <polyline points="-5,-7 4,0 -5,7" fill="none" stroke="#0B0F19" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Orbital satellite dot -->
    <circle cx="96" cy="40" r="4" fill="#38BDF8"/>
  </g>

  <!-- === WORDMARK === -->
  <g transform="translate(136, 0)">
    <text x="0" y="58" font-family="'Inter', 'Google Sans', 'SF Pro Display', -apple-system, sans-serif" font-size="38" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">
      Gemini
    </text>

    <text x="0" y="96" font-family="'Inter', 'Google Sans', 'SF Pro Display', -apple-system, sans-serif" font-size="30" font-weight="500" fill="#94A3B8" letter-spacing="0">
      How-To
    </text>

    <!-- Gradient accent line -->
    <line x1="0" y1="104" x2="128" y2="104" stroke="url(#geminiGradDark)" stroke-width="3" stroke-linecap="round"/>

    <!-- Subtitle -->
    <text x="165" y="48" font-family="'Inter', 'Google Sans', 'SF Pro Display', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#60A5FA" letter-spacing="1.5">
      PRACTICAL VISUAL GUIDE
    </text>
    <text x="165" y="63" font-family="'Inter', 'Google Sans', 'SF Pro Display', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#CBD5E1" letter-spacing="1.5">
      TO GOOGLE ANTIGRAVITY &amp; GEMINI
    </text>
    <text x="165" y="78" font-family="'Inter', 'Google Sans', 'SF Pro Display', -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" letter-spacing="1.2">
      APP v2.24 • CLI v1.4 • SDK v0.1.22
    </text>
  </g>
</svg>
